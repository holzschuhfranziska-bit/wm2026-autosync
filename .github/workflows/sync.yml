name: WM 2026 Auto-Sync + Backup

on:
  schedule:
    - cron: '*/5 * * * *'   # alle 5 Minuten
  workflow_dispatch:          # manuell startbar

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # nötig um Backup-Dateien ins Repo zu committen

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync & Backup ausführen
        run: node sync.js
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          GAS_URL:          ${{ secrets.GAS_URL }}

      - name: Backup committen
        run: |
          git config user.name  "WM2026 Bot"
          git config user.email "bot@wm2026-tippspiel"
          git add backups/
          git diff --staged --quiet || git commit -m "Backup $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push